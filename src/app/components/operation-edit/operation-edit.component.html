<div *ngIf="operation">
  <h2>Edit Operation</h2>
  <form (ngSubmit)="updateOperation()" #operationForm="ngForm">


    <div>
      <label for="description">Description:</label>
      <input 
        id="description" 
        class="description-input" 
        [(ngModel)]="operation.description" 
        name="description" 
        required
        #description="ngModel"
      >
      <div *ngIf="description.invalid && (description.dirty || description.touched)" class="error-message">
        <small *ngIf="description.errors?.['required']">Description is required.</small>
      </div>
    </div>

    <div>
      <label for="code">Code:</label>
      <textarea 
        id="code" 
        [(ngModel)]="operation.code" 
        name="code" 
        rows="8" 
        cols="40" 
        required
        #code="ngModel"
      ></textarea>
      <div *ngIf="code.invalid && (code.dirty || code.touched)" class="error-message">
        <small *ngIf="code.errors?.['required']">Code is required.</small>
      </div>
    </div>

    <button type="submit" [disabled]="operationForm.invalid">Update</button>
  </form>
  <div *ngIf="errorMessage" class="error-message">
    <p>{{ errorMessage }}</p>
  </div>
</div>
