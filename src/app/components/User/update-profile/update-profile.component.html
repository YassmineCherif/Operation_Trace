<div class="update-profile-container">
    <h2>Update Profile</h2>
    <form (ngSubmit)="onSubmit()" #updateProfileForm="ngForm">
      <div>
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          [placeholder]="email"
        />
        <p *ngIf="updateProfileForm.submitted && !email" class="error-message">Email is required.</p>
        <p *ngIf="updateProfileForm.submitted && !isValidEmail(email)" class="error-message">Please enter a valid email address.</p>
      </div>
      <div>
        <label for="numtel">Phone number:</label>
        <input
          type="text"
          id="numtel"
          name="numtel"
          [(ngModel)]="numtel"
          required
          [placeholder]="numtel"
        />
        <p *ngIf="updateProfileForm.submitted && !numtel" class="error-message">Phone number is required.</p>
        <p *ngIf="updateProfileForm.submitted && !isValidPhoneNumber(numtel)" class="error-message">Phone number must be 8 digits.</p>
      </div>
      <div>
        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          [placeholder]="password ? '********' : 'Enter new password'"
        />
        <p *ngIf="updateProfileForm.submitted && !password && password !== ''" class="error-message">Password is required.</p>
      </div>
      <div>
        <label for="confirmPassword">Confirm Password:</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          [placeholder]="confirmPassword ? '********' : 'Confirm your password'"
        />
        <p *ngIf="updateProfileForm.submitted && !confirmPassword && confirmPassword !== ''" class="error-message">Confirm Password is required.</p>
        <p *ngIf="updateProfileForm.submitted && password !== confirmPassword" class="error-message">Passwords do not match.</p>
      </div>
      <button type="submit">Update</button>
      <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
      <p *ngIf="successMessage" class="success-message">{{ successMessage }}</p>
    </form>
</div>
